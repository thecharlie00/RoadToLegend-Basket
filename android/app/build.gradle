plugins { id 'com.android.application' }

android {
    namespace 'com.caminoalaro.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.caminoalaro.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // Deliberately no signing config, publishing task, ad SDK or network dependency.
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
}
